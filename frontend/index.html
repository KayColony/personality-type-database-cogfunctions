<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Database</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 0 16px;
    }
    label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
    }
    input, select, button {
      font-size: 16px;
      padding: 8px;
      margin-top: 4px;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Type Database</h1>

  <form id="person-form">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="e.g. Alice" required>

    <label for="type">Type</label>
    <select id="type" name="type" required>
      <option value="">Choose a type</option>
      <option>INTJ</option>
      <option>INTP</option>
      <option>ENTJ</option>
      <option>ENTP</option>
      <option>INFJ</option>
      <option>INFP</option>
      <option>ENFJ</option>
      <option>ENFP</option>
      <option>ISTJ</option>
      <option>ISFJ</option>
      <option>ESTJ</option>
      <option>ESFJ</option>
      <option>ISTP</option>
      <option>ISFP</option>
      <option>ESTP</option>
      <option>ESFP</option>
    </select>

    <button type="submit">Add person</button>
  </form>

  <h2>People</h2>
  <ul id="people-list"></ul>

  <script src="app.js"></script>
</body>
</html>
