<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Database</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>People</h1>
      <span id="people-count" class="muted"></span>
    </header>

    <!-- Switch between the two views -->
    <div class="view-switch" role="tablist" aria-label="View">
      <button type="button" role="tab" id="tab-database" data-view="database" aria-selected="true">Database</button>
      <button type="button" role="tab" id="tab-types" data-view="types" aria-selected="false">Types</button>
    </div>

    <!-- ========== Database view: the ledger table ========== -->
    <section id="database-view">
    <label for="search" class="visually-hidden">Search</label>
    <input id="search" class="search" type="search" placeholder="Search names, types or typers" autocomplete="off">

    <table class="ledger">
      <thead>
        <tr>
          <th class="col-name"><button type="button" class="sort" data-key="name">Name</button></th>
          <th class="col-type"><button type="button" class="sort has-menu" data-key="mbti" aria-haspopup="true" aria-expanded="false">Type</button></th>
          <th class="col-by"><button type="button" class="sort has-menu" data-key="typer" aria-haspopup="true" aria-expanded="false">By</button></th>
          <th class="col-sure"><button type="button" class="sort has-menu" data-key="confidence" aria-haspopup="true" aria-expanded="false">Sure</button></th>
          <th class="col-date"><button type="button" class="sort" data-key="created_at">Date</button></th>
        </tr>
      </thead>
      <tbody id="people-rows"></tbody>
    </table>

    <p id="empty-message" class="empty muted" hidden></p>

    <!-- One dropdown menu, reused by the Type, By and Sure headings. -->
    <div id="column-menu" class="column-menu" role="dialog" aria-label="Sort and filter" hidden>
      <div class="menu-section">
        <button type="button" class="menu-sort" data-direction="up"></button>
        <button type="button" class="menu-sort" data-direction="down"></button>
      </div>
      <div class="menu-section">
        <div class="menu-heading">Show only</div>
        <div id="menu-options"></div>
      </div>
      <button type="button" id="menu-clear" class="menu-clear">Show all</button>
    </div>
    </section>

    <!-- ========== Types view: the 16-type grid ========== -->
    <section id="types-view" hidden>
      <div class="types-toolbar">
        <label for="types-typer" class="field-label">Typed by</label>
        <select id="types-typer" class="field"></select>
      </div>

      <div id="type-grid" class="type-grid"></div>

      <div class="type-heading">
        <span id="type-title"></span>
        <span id="type-count" class="muted"></span>
      </div>
      <div id="type-people"></div>
    </section>

    <div class="bottom-bar">
      <button type="button" id="open-add" class="primary">Add person</button>
    </div>
  </main>


  <!-- ========== Add a new person (with their first typing) ========== -->
  <dialog id="add-dialog" class="sheet">
    <form id="add-form" class="sheet-body">
      <div class="sheet-top">
        <h2>New person</h2>
        <button type="button" class="icon-button" data-close aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>

      <label for="add-name" class="field-label">Name</label>
      <input type="text" id="add-name" class="field" required autocomplete="off" maxlength="100">

      <!-- Existing people whose names match what's being typed. -->
      <div id="add-matches" class="matches" hidden>
        <div class="field-label">Already here? Tap to open them instead</div>
        <div id="add-matches-list"></div>
      </div>

      <label for="add-typer" class="field-label">Typed by</label>
      <input type="text" id="add-typer" class="field" required autocomplete="off">

      <label for="add-type" class="field-label">Type</label>
      <select id="add-type" class="field type-select" required></select>

      <label for="add-confidence" class="field-label">Confidence</label>
      <select id="add-confidence" class="field confidence-select" required></select>

      <label for="add-notes" class="field-label">Notes <span class="optional">optional</span></label>
      <textarea id="add-notes" class="field notes-field" rows="3" maxlength="2000"></textarea>

      <div class="form-buttons">
        <button type="button" class="secondary" data-close>Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>


  <!-- ========== One person: all their typings ========== -->
  <dialog id="person-dialog" class="sheet">
    <div class="sheet-body">
      <div class="sheet-top">
        <div>
          <h2 id="person-name"></h2>
          <p id="person-meta" class="muted small"></p>
        </div>
        <button type="button" class="icon-button" data-close aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>

      <div id="person-summary" class="summary"></div>

      <div class="section-label">Typings</div>
      <div id="typing-list" class="typing-list"></div>

      <form id="typing-form" class="typing-form">
        <div id="typing-form-title" class="section-label">Add your typing</div>

        <label for="typing-typer" class="field-label">Typed by</label>
        <input type="text" id="typing-typer" class="field" required autocomplete="off">

        <label for="typing-type" class="field-label">Type</label>
        <select id="typing-type" class="field type-select" required></select>

        <label for="typing-confidence" class="field-label">Confidence</label>
        <select id="typing-confidence" class="field confidence-select" required></select>

        <label for="typing-notes" class="field-label">Notes <span class="optional">optional</span></label>
        <textarea id="typing-notes" class="field notes-field" rows="3" maxlength="2000"></textarea>

        <div class="form-buttons">
          <button type="button" id="cancel-edit" class="secondary" hidden>Cancel</button>
          <button type="submit" id="typing-save" class="primary">Add typing</button>
        </div>
      </form>

      <div class="person-actions">
        <button type="button" id="rename-person" class="text-button">Rename</button>
        <button type="button" id="delete-person" class="text-button">Delete person</button>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
